<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment</title>
    <link rel="stylesheet" href="login.css">
</head>
<body class="body">

    <form class="loginform">
        
        <h1 align="center" >Welcome Back!</h1>
        <p align="center" >Please login to your account</p>
        
        <div >
            <label for="email">Email Address</label><br>
            <input type="email" id="email" name="email" placeholder="Enter your email" class="inputgroup">
        </div>
        <div >
            <label for="password">Password</label><br>
            <input type="password" id="password" name="password" placeholder="Enter your password" class="inputgroup">
        </div>
        <div>
            <input type="checkbox" name="checkbox" id="checkbox" value="checkbox"  class="input">
            <label class="remember">Remember Me</label>

            <div class="forgot"><a href="">Forgot Password?</a></div>

        </div>
        <button class="submmit" type="submmit">Login</button>
        <div align="center" class="signin">Don't have an account?<a href="#">Sign In</a></div>
    </form>
</body>
</html>
