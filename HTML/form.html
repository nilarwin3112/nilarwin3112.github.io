<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <form action="" method="get">
    <label for="name">Name</label>
    <input type="text" name="stuName" id="name">
    <br><br>
    <label for="email">Email</label>
    <input type="email" name="stuEmail" id="email">
    <br><br>
    <label for="password">Password</label>
    <input type="password" name="stuPassword" id="password">
    <br><br>
    <label for="phone">Phone</label>
    <input type="number" name="stuPhone" id="phone">
    <br><br>
    <label for="dob">Date of birth</label>
    <input type="date" name="stuDOB" id="dob">
    <br><br>
    <label for="passport">Passport</label>
    <input type="file" accept=".jpg,.png" name="stuPassport" id="passport">
    <br><br>
    <label for="year">Year</label>
    <select name="stuYear" id="year">
      <option value="">Choose Year</option>
      <option value="1">First Year</option>
      <option value="2">Second Year</option>
      <option value="3">Third Year</option>
    </select>
    <br><br>
    <label for="">Gender</label>
    <input type="radio" name="gender" id="male" value="Male">
    <label for="male">Male</label>
    <input type="radio" name="gender" id="female" value="Female">
    <label for="female">Female</label>
    <br><br>
    
    <label for="">Hobby</label>
    <input type="checkbox" name="hobby" id="travelling" value="Travelling">
    <label for="travelling">Travelling</label>
    <input type="checkbox" name="hobby" id="gamming" value="Gamming">
    <label for="gamming">Gamming</label>
    <input type="checkbox" name="hobby" id="reading" value="Reading">
    <label for="reading">Reading</label>
    <br><br>

    <label for="address">Address</label>
    <textarea name="stuAddresss" id="address" cols="30" rows="10"></textarea>
    <br><br>
    <input type="text" name="city1" id="" value="Yangon">
    <input type="text" name="city2" id="" value="Mandalay" readonly>

    <input type="text" name="" id="" required>
    
    <input type="text" name="" id="" placeholder="example.com">
    <input type="time" name="">
    <br><br>
    <input type="color">
    <input type="range">
    <button type="submit">Save</button>
  </form>
</body>
</html>
