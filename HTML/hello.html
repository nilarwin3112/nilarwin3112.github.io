<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <h1>Hello HTML</h1>

  <!-- tag  -->
  <p></p>

  <!--  Element -->
  <p>Hello</p>
  <div>
    <h2>Hi</h2>
  </div>

  <!-- Attribute --> 
  <!-- key = "value" -->
  <p align="right">This is p element 1</p>
  <p align="center">This is p element 2</p>
  <p align="left">This is p element 3</p>

  <!-- Global Attribute
       class and id
  -->
  <p class="p-text p-element">This is p element 4</p><p class="p-text ">This is p element 5</p>

  <!-- Urgly Code -->
   <div><div><h1>Title 1</h1><p>This is paragraph</p></div><h1>Title 2</h1><p>This is paragraph</p></div>

   <!-- Pretty Code -->
   <div>
    <div>
      <h1>Title 1</h1>
      <p>This is paragraph</p>
    </div>
    <div>
      <h1>Title 2</h1>
      <p>This is paragraph</p>
    </div>
   </div>

</body>
</html>
